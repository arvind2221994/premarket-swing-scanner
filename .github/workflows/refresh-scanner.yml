name: Refresh scanner and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scanner/requirements.txt

      - name: Generate live scanner data
        run: python scanner/scanner.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- docs/data/latest.json; then
            echo "Scanner data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git commit -m "Refresh scanner data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  alert-on-failure:
    needs: [refresh, deploy]
    if: ${{ always() && (needs.refresh.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update scanner failure alert
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scanner scheduled workflow failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scanner refresh or Pages deployment failed at ${new Date().toISOString()}.`,
              "",
              `Workflow run: ${runUrl}`,
              `Refresh result: ${{ needs.refresh.result }}`,
              `Deploy result: ${{ needs.deploy.result }}`
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              creator: "github-actions[bot]"
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }